name: Build Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connwatch-windows-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Install packaging tools
        run: |
          python -m pip install pefile
          go install github.com/akavel/rsrc@v0.10.2
      - name: Obtain verified Windows runtime inputs
        run: python scripts/fetch_windows_runtime.py
      - name: Build Windows GUI launcher
        working-directory: scripts/windows/launcher
        run: |
          rsrc -ico ../../../assets/connwatch.ico -manifest ../app.manifest -o rsrc.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o ../../../build/ConnWatch.exe .
      - name: Package application and runtime
        run: python scripts/build_windows.py
      - name: Build Windows setup
        working-directory: scripts/windows/setup
        run: |
          cp ../../../build/windows-payload.zip payload.zip
          rsrc -ico ../../../assets/connwatch.ico -manifest ../app.manifest -o rsrc.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o ../../../build/ConnWatch-Network-Setup-3.0.0.exe .
      - name: Assemble release files and checksums
        run: |
          mkdir -p build/release
          cp build/ConnWatch-Network-Setup-3.0.0.exe build/release/
          cp build/windows-payload.zip build/release/ConnWatch-Network-Windows-3.0.0.zip
          git archive --format=zip --prefix=ConnWatch-Network/ HEAD -o build/release/ConnWatch-Network-Source-Kali-3.0.0.zip
          cp docs/ConnWatch-Network-Presentation.pdf build/release/
          cd build/release
          sha256sum *.exe *.zip *.pdf > SHA256SUMS.txt
      - name: Publish unsigned development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          ConnWatch Network 3.0.0 — Developed by ZakirUllah.

          Includes the Windows setup EXE, portable ZIP, complete Kali/Linux source, presentation PDF and SHA-256 checksums.

          This is an unsigned development release. Windows packages are cross-compiled and packaged from this commit; native Windows installation and real-LAN acceptance remain outstanding. Linux verification is documented in docs/PUBLICATION-CHECKS.md. Only assess networks you own or are authorized to scan.

          See the repository README for features, Windows installation, Kali setup and troubleshooting. Release checksums apply to these newly built release assets; repository downloads/SHA256SUMS.txt records the earlier supplied Windows packages.
          NOTES
          gh release create v3.0.0 --target "$GITHUB_SHA" --title "ConnWatch Network 3.0.0" --notes-file build/release-notes.md --prerelease --draft build/release/*
          gh release edit v3.0.0 --draft=false
